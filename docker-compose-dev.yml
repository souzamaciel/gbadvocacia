name: ${COMPOSE_PROJECT_NAME:-gb_advocacia}

services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile-dev
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - redis
        networks:
            - laravel
        extra_hosts:
            - "app.gbadvocacia.test.br:127.0.0.1"            

    # nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped        
        ports:
            - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - laravel

    # mysql
    mysql:
        platform: linux/amd64
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            - "${FORWARD_DB_PORT:-3307}:3306"
        networks:
            - laravel

    # queue
    queue:        
        build:
            context: .
            dockerfile: Dockerfile-dev
        restart: unless-stopped
        command: "php artisan queue:work"
        volumes:
            - ./:/var/www
        depends_on:
            - redis
            - app
        networks:
            - laravel

    # redis
    redis:
        image: redis:latest
        restart: unless-stopped
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
